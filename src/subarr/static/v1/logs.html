<style>
  html, body, #root { height: 100%; }

  /* Logs page: lock shell to viewport so the log stream area scrolls
     internally instead of the whole page going mega-scroll. */
  .app-shell {
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg-0);
    min-width: 1280px;
  }
  body { overflow: hidden; }
  .app-body { flex: 1; display: flex; min-height: 0; overflow: hidden; }
  .main-canvas {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
</style>
