<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Subarr · Home</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="icon" type="image/svg+xml" href="/static/v1/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/static/v1/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/v1/favicon-16.png">
<link rel="apple-touch-icon" sizes="192x192" href="/static/v1/favicon-192.png">
<link rel="manifest" href="/static/v1/site.webmanifest">

<!-- OpenGraph + Twitter share preview (#116) -->
<meta property="og:title" content="Subarr">
<meta property="og:description" content="The queue + control layer subgen never had.">
<meta property="og:image" content="https://github.com/coaxk/subarr/raw/main/src/subarr/static/v1/og-card.png">
<meta property="og:url" content="https://github.com/coaxk/subarr">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="home-hifi/tokens.css">

<style>
  /* Page-specific */
  html, body, #root { height: 100%; }
  body { overflow: hidden; }

  /* Stage tile hover */
  .stage-tile:hover {
    background: var(--bg-2) !important;
    border-color: var(--bg-5) !important;
  }

  /* Pulse animation for status dots */
  @keyframes pulse {
    0%   { transform: scale(1);   opacity: 0.6; }
    70%  { transform: scale(2.4); opacity: 0;   }
    100% { transform: scale(2.4); opacity: 0;   }
  }

  /* Lock the shell to viewport height so the SubRail (containing GPU
     widget, walker state, queue vitals) stays sticky as the user
     scrolls the main canvas. Same containment pattern as Coverage. */
  .app-shell {
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg-0);
    /* Desktop-first design: hold a minimum width so the layout
       degrades by horizontal scroll, not by squeezing tiles. */
    min-width: 1280px;
  }

  .app-body {
    flex: 1;
    display: flex;
    min-height: 0;
    overflow: hidden;
  }

  .main-canvas {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: 22px 24px 20px;
    gap: 18px;
    overflow-y: auto;
  }
</style>

<!-- React 18.3.1 production build, self-hosted (no CDN) so subarr renders offline / airgapped. -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
</head>
<body>
<div id="root"></div>

<script src="home-hifi/home.bundle.js" defer></script>
</body>
</html>
