<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Subarr · Home</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="icon" type="image/svg+xml" href="/static/v1/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="home-hifi/tokens.css">

<style>
  /* Page-specific */
  html, body, #root { height: 100%; }
  body { overflow: hidden; }

  /* Stage tile hover */
  .stage-tile:hover {
    background: var(--bg-2) !important;
    border-color: var(--bg-5) !important;
  }

  /* Pulse animation for status dots */
  @keyframes pulse {
    0%   { transform: scale(1);   opacity: 0.6; }
    70%  { transform: scale(2.4); opacity: 0;   }
    100% { transform: scale(2.4); opacity: 0;   }
  }

  .app-shell {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg-0);
    /* Desktop-first design: hold a minimum width so the layout
       degrades by horizontal scroll, not by squeezing tiles. */
    min-width: 1280px;
  }

  body { overflow: auto; }

  .app-body {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  .main-canvas {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: 22px 24px 20px;
    gap: 18px;
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="home-hifi/atoms.jsx"></script>
<script type="text/babel" src="home-hifi/chrome.jsx"></script>
<script type="text/babel" src="home-hifi/dashboard.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
function App() {
  // Live clock (1s tick) — purely client-side, independent of API.
  const [now, setNow] = React.useState(fmtTime(new Date()));
  React.useEffect(() => {
    const id = setInterval(() => setNow(fmtTime(new Date())), 1000);
    return () => clearInterval(id);
  }, []);

  // Live dashboard data — fetches /api/home/dashboard every 5s.
  // Each section falls back to demo constants when its slice is null
  // (first paint, or backend unreachable). useLiveDashboard is
  // exported from dashboard.jsx onto window.
  const live = useLiveDashboard();

  return (
    <div className="app-shell">
      <TopBar section="overview" />
      <div className="app-body">
        <SubRail section="overview" activeId="dashboard" />
        <main className="main-canvas">
          <PageHeader now={now} />
          <StagesRow data={live && live.stages} />
          <HostStrip
            integrations={live && live.integrations}
            gpu={live && live.gpu}
          />
          <NextRunActivitySplit
            nextRun={live && live.next_run}
            activity={live && live.activity}
          />
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
