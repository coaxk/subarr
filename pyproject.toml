[project]
name = "subarr"
version = "1.0.1"
description = "Subarr — *arr-family service for subtitle coordination (subgen driver, coverage dashboard, automation)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # #115: upper bounds capped at the next known-breaking major. The
    # version floor is the lowest API we depend on; the ceiling protects
    # against future breakage when these libs cut a major.
    # FastAPI + Pydantic both sit on the 0.x / 2.x line — a future 1.0 /
    # 3.0 is the obvious break point.
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "httpx>=0.27,<1.0",
    "docker>=7.0,<8.0",
    "pyyaml>=6.0,<7.0",
    "pydantic>=2.6,<3.0",
    # defusedxml replaces stdlib xml.etree for parsing untrusted *arr config.
    # Bandit B314 flagged the raw stdlib usage; defusedxml is the drop-in fix.
    "defusedxml>=0.7,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.23,<2.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.3,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Static assets (HTML/CSS/JS) ship inside the installed package so the
# container image's /usr/local/lib/python3.12/site-packages/subarr/static
# directory exists. Without this, setuptools only copies *.py files and
# the frontend is silently missing in the wheel (404 at / + /static/*).
# Caught 2026-05-27 after v1.1 deploy.
[tool.setuptools.package-data]
subarr = ["static/**/*", "migrations/*.sql", "migrations/*.md"]

[tool.pytest.ini_options]
# Playwright suite lives at tests/e2e/ — JS/TS, not Python. Excluding
# keeps `pytest` running just the Python unit tests.
testpaths = ["tests"]
norecursedirs = ["tests/e2e"]

[tool.ruff]
line-length = 110
target-version = "py311"
