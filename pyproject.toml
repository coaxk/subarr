[project]
name = "subarr"
version = "0.1.0"
description = "Subarr — *arr-family service for subtitle coordination (subgen driver, coverage dashboard, automation)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "docker>=7.0",
    "pyyaml>=6.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Static assets (HTML/CSS/JS) ship inside the installed package so the
# container image's /usr/local/lib/python3.12/site-packages/subarr/static
# directory exists. Without this, setuptools only copies *.py files and
# the frontend is silently missing in the wheel (404 at / + /static/*).
# Caught 2026-05-27 after v1.1 deploy.
[tool.setuptools.package-data]
subarr = ["static/**/*", "migrations/*.sql", "migrations/*.md"]

[tool.ruff]
line-length = 110
target-version = "py311"
