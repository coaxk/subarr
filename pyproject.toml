[project]
name = "subarr"
version = "1.3.0"
description = "Subarr — *arr-family service for subtitle coordination (subgen driver, coverage dashboard, automation)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # #115: upper bounds capped at the next known-breaking major. The
    # version floor is the lowest API we depend on; the ceiling protects
    # against future breakage when these libs cut a major.
    # FastAPI + Pydantic both sit on the 0.x / 2.x line — a future 1.0 /
    # 3.0 is the obvious break point.
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "httpx>=0.27,<1.0",
    "docker>=7.0,<8.0",
    "pyyaml>=6.0,<7.0",
    "pydantic>=2.6,<3.0",
    # defusedxml replaces stdlib xml.etree for parsing untrusted *arr config.
    # Bandit B314 flagged the raw stdlib usage; defusedxml is the drop-in fix.
    "defusedxml>=0.7,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.23,<2.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.3,<1.0",
]
# #111: speech-aware audio (silero VAD). onnxruntime + numpy only — NOT the
# `silero-vad` pip package, which drags in PyTorch (~800MB) even in onnx mode
# (its read_audio/get_speech_timestamps need torch tensors). We run the ONNX
# model directly via onnxruntime + numpy (~65MB total, no torch). The base
# install stays ML-free; the Docker image bakes this extra in so the runtime
# is present and only the ~2MB model is pulled on opt-in.
vad = [
    "onnxruntime>=1.16,<2.0",
    "numpy>=1.24,<3.0",
]
# #123: QE/adequacy judge (the tournament summit). LaBSE cross-lingual
# embeddings via sentence-transformers; validated rho=0.727 vs true accuracy.
# DELIBERATELY NOT baked into the image (unlike [vad]) — sentence-transformers
# pulls torch (~2GB). Pure opt-in for now; an onnx-lean LaBSE backend (drop the
# torch weight, bakeable like silero) is the tracked follow-up optimization.
qe = [
    "sentence-transformers>=2.2,<6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Static assets (HTML/CSS/JS) ship inside the installed package so the
# container image's /usr/local/lib/python3.12/site-packages/subarr/static
# directory exists. Without this, setuptools only copies *.py files and
# the frontend is silently missing in the wheel (404 at / + /static/*).
# Caught 2026-05-27 after v1.1 deploy.
[tool.setuptools.package-data]
subarr = ["static/**/*", "migrations/*.sql", "migrations/*.md"]

[tool.pytest.ini_options]
# Playwright suite lives at tests/e2e/ — JS/TS, not Python. Excluding
# keeps `pytest` running just the Python unit tests.
testpaths = ["tests"]
norecursedirs = ["tests/e2e"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Default selection (pycodestyle E/W + pyflakes F). We enforce pyflakes (F) —
# real correctness issues like unused/undefined names and redefinitions — and
# most of pycodestyle, but relax a few E7 style rules that conflict with this
# codebase's deliberate, working patterns. Layout is owned by `ruff format`.
ignore = [
    "E402",  # module-import-not-at-top: intentional late imports avoid circular deps (e.g. routers/queue.py)
    "E741",  # ambiguous var names (l/I/O): present in terse numeric code; rename churn/risk outweighs value
    "E731",  # lambda assignment: used deliberately in a handful of spots
    "E701",  # multiple statements on one line (colon): terse one-line guards
    "E702",  # multiple statements on one line (semicolon): same
]
