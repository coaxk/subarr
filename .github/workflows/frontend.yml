# Frontend drift check — run on every PR that touches the SPA.
#
# Why: the v1 SPA bundles (src/subarr/static/v1/home-hifi/*.bundle.js +
# .map) are committed pre-built so `pip install` ships a working app
# without a Node toolchain. That tradeoff requires a guardrail: if
# someone edits a .jsx source without rebuilding, the bundle goes
# stale and runtime behaviour silently diverges from the source.
#
# This job runs `npm run check:frontend` which rebuilds + asserts
# `git diff --exit-code` on the static dir. If the working tree differs
# after a fresh build, the PR fails.

name: frontend

# Runs on every PR + every push to main, unconditionally. Branch
# protection treats "bundle drift check" as required, so the check
# must produce a status on every commit — path-filtering it caused
# PRs that don't touch frontend to be permanently BLOCKED (the
# required check would never run, never go green).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  drift:
    name: bundle drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Build bundles and assert no drift
        # We check ONLY the compiled .js + .html — the source-of-truth
        # for runtime behaviour. We do NOT check .map files: esbuild
        # emits platform-dependent unicode-escape encoding for
        # sourcesContent (Windows vs Linux differ on chars like ─),
        # so a Win-built bundle is byte-different from a Linux-built
        # bundle even though both produce identical runtime behaviour.
        # Gating releases on .map byte-equality would mean either
        # forcing devs to build only on Linux or removing maps from
        # version control — neither buys us actual safety. The .js
        # check still catches the real bug (source edited, bundle not
        # rebuilt) because the executable code IS deterministic.
        run: |
          npm run build:frontend
          if ! git diff --exit-code -- 'src/subarr/static/v1/home-hifi/*.bundle.js' 'src/subarr/static/v1/home-hifi/*.html'; then
            echo ""
            echo "::error::Frontend bundles are stale. Run 'npm run build:frontend' locally and commit the result."
            exit 1
          fi
