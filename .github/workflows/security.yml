# Security scans — on every PR + weekly schedule.
#
# Four independent jobs run in parallel; any can fail without blocking
# the others (so a single tool's false-positive doesn't block a PR).
# Each posts a SARIF report to GitHub's code-scanning UI when relevant.
#
# Tools:
#   - bandit       — Python static security analysis (insecure_use, etc)
#   - pip-audit    — CVE check on pinned + transitive deps
#   - semgrep      — pattern-based scan with security rulesets
#   - trivy        — container-image CVE scan against the built image
#
# Weekly run catches CVEs in our deps even when nobody opened a PR.

name: security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Mondays 07:00 UTC — staggered so it doesn't pile on with rebase-test
    # in the sibling subarr-subgen repo (06:00 UTC).
    - cron: "0 7 * * 1"
  workflow_dispatch:

# Least-privilege at the workflow level. The SARIF-uploading jobs (bandit,
# semgrep, trivy) elevate to security-events: write + actions: read themselves
# (actions: read is required by codeql-action/upload-sarif to read run metadata,
# else it fails "Resource not accessible by integration").
permissions:
  contents: read

jobs:
  bandit:
    name: bandit (Python static analysis)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload-sarif (best-effort)
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.11" }
      - run: pip install bandit[sarif]
      - name: bandit -r src/
        # -ll = report only medium+high severity, skip low.
        # -ii = report only medium+high confidence, skip low.
        # B101 (assert_used) excluded — pytest depends on it.
        # B608 (sql injection via string-format) handled case-by-case.
        run: |
          bandit -r src/subarr \
                 -ll -ii \
                 --skip B101 \
                 -f sarif -o bandit.sarif || true
          bandit -r src/subarr -ll -ii --skip B101
      # SARIF upload requires "Code Scanning" enabled in repo settings →
      # Security → Code security and analysis. Until that's flipped on,
      # upload would fail every run. We don't want that to block PRs
      # (the bandit step above already produces the pass/fail signal),
      # so this is best-effort only.
      - if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: bandit.sarif
          category: bandit

  pip-audit:
    name: pip-audit (dep CVEs)
    runs-on: ubuntu-latest
    permissions:
      contents: read # no SARIF upload — stays minimal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.11" }
      - run: pip install pip-audit
      - name: pip-audit on declared deps
        # --strict fails on any vuln. We want this to fail PRs to force
        # awareness; can be downgraded with --ignore-vuln on a per-CVE
        # basis if upstream hasn't released a fix yet.
        #
        # subarr itself isn't on PyPI — auditing it produces "distribution
        # marked as editable" errors. Filter our own package out of the
        # frozen deps and feed pip-audit the cleaned requirements file.
        run: |
          pip install -e .
          pip freeze --exclude-editable > requirements-audit.txt
          pip-audit --strict --desc -r requirements-audit.txt

  semgrep:
    name: semgrep (pattern security)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload-sarif (best-effort)
      actions: read
    container:
      # Pinned by digest (v1.142.0). trivy-action's Mar-2026 tag-poisoning is
      # exactly why mutable tags on security tooling are a risk. dependabot's
      # github-actions ecosystem keeps container images current; bump manually
      # if a newer rule set is wanted sooner.
      image: semgrep/semgrep@sha256:03402a5040a88a570dec58375ef1a19fa777dd61575afdc7d5527ddf308dd765
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: semgrep ci
        env:
          SEMGREP_RULES: >-
            p/python
            p/security-audit
            p/secrets
            p/owasp-top-ten
        run: semgrep ci --sarif --output=semgrep.sarif || true
      - if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  trivy:
    name: trivy (container image CVEs)
    runs-on: ubuntu-latest
    needs: []
    permissions:
      contents: read
      security-events: write # upload-sarif (best-effort)
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      # Expire the Dockerfile's apt layer daily. Without this the GHA cache
      # serves a stale layer and we scan (and ship) packages that Debian has
      # already patched — see the APT_REFRESH comment in the Dockerfile.
      - id: aptdate
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: subarr:scan
          cache-from: type=gha
          build-args: |
            APT_REFRESH=${{ steps.aptdate.outputs.date }}
      # The table-format invocation is the actual PR gate. Why not the
      # SARIF one? In format=sarif mode, trivy-action internally scans
      # with "all severities" to populate the GitHub code-scanning UI,
      # and the `severity` + `ignore-unfixed` filters DON'T propagate to
      # the exit-code check — so the SARIF step exits 1 on unfixed LOW
      # CVEs in upstream Debian packages we can do nothing about.
      # Filed: https://github.com/aquasecurity/trivy-action/issues/389
      #
      # Split: table step is the gate (filters apply correctly here),
      # SARIF step is exit-code 0 (best-effort artifact producer).
      - name: trivy scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: subarr:scan
          format: table
          # Fail on HIGH and CRITICAL only — the noise from MEDIUM+below
          # in upstream Python base images would be unmanageable.
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: trivy scan (SARIF artifact)
        # Action tags use the "v" prefix on this publisher's repo.
        # exit-code 0 here — the gate above already decided pass/fail.
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: subarr:scan
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true
      - if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: trivy.sarif
          category: trivy
