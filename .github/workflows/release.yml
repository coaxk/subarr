name: build-and-publish

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

# Least-privilege default; the publish job elevates to packages: write itself.
permissions:
  contents: read

jobs:
  # Tag pushes block on tests + drift check first. Main-branch pushes also
  # block — every image we publish to GHCR ran the test suite on the same
  # commit. Cheap insurance against a typo shipping to :latest.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: pip install -e .[dev]
      # release.yml runs only on trusted push/tags (never PRs), so there is no
      # PR→privileged-cache poisoning vector; setup-node isn't configured to
      # cache here anyway (no `cache:` input).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: '20'
      - run: npm ci || npm install
      # Drift check: rebuild bundles and fail if anything changed. Forces
      # contributors to commit their bundle changes alongside the JSX.
      - run: npm run check:frontend
      - run: PYTHONPATH=src pytest -q --tb=line

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to GHCR
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # QEMU for the arm64 half of the multi-arch build (#70). subarr is pure
      # Python + apt packages (ffmpeg/mkvtoolnix) with arm64 wheels for
      # everything in [vad] (onnxruntime ships aarch64), so emulated builds are
      # just slower, not fragile. The README's "runs on a Pi" is real now.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Expire the Dockerfile's apt layer daily, so a published image never
      # ships packages Debian has already patched just because the GHA layer
      # cache was warm — see the APT_REFRESH comment in the Dockerfile.
      - id: aptdate
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APT_REFRESH=${{ steps.aptdate.outputs.date }}

  # Auto-create the GitHub Release on a version tag, AFTER the image publishes
  # (#229). A bare tag with no Release shows an empty title in releases.atom,
  # which blanks the #203 update nudge fleet-wide — so the title must be
  # non-empty and descriptive. Tag pushes only; idempotent (skips if the
  # release already exists, e.g. a re-run or a manual pre-create).
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    env:
      GH_TOKEN: ${{ github.token }} # gh CLI auth
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: create GitHub Release from CHANGELOG (idempotent)
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release $TAG already exists — skipping (idempotent)"
            exit 0
          fi
          # Derives a non-empty title (the #203 contract) and writes the body;
          # the script is stdlib-only, so the runner's python3 is enough.
          TITLE="$(python3 scripts/changelog_section.py "$TAG" --body-out "$RUNNER_TEMP/notes.md")"
          echo "release title: $TITLE"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
