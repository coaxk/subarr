name: build-and-publish

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

# Least-privilege default; the publish job elevates to packages: write itself.
permissions:
  contents: read

jobs:
  # Tag pushes block on tests + drift check first. Main-branch pushes also
  # block — every image we publish to GHCR ran the test suite on the same
  # commit. Cheap insurance against a typo shipping to :latest.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - run: pip install -e .[dev]
      # release.yml runs only on trusted push/tags (never PRs), so there is no
      # PR→privileged-cache poisoning vector; setup-node isn't configured to
      # cache here anyway (no `cache:` input).
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6 # zizmor: ignore[cache-poisoning]
        with:
          node-version: '20'
      - run: npm ci || npm install
      # Drift check: rebuild bundles and fail if anything changed. Forces
      # contributors to commit their bundle changes alongside the JSX.
      - run: npm run check:frontend
      - run: PYTHONPATH=src pytest -q --tb=line

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to GHCR
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      # QEMU for the arm64 half of the multi-arch build (#70). subarr is pure
      # Python + apt packages (ffmpeg/mkvtoolnix) with arm64 wheels for
      # everything in [vad] (onnxruntime ships aarch64), so emulated builds are
      # just slower, not fragile. The README's "runs on a Pi" is real now.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
