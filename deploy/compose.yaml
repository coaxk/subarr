services:
  subarr:
    image: ghcr.io/coaxk/subarr:latest
    container_name: subarr
    restart: unless-stopped
    networks:
    - safe-bridge
    ports:
    - 9922:9922
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    environment:
      TZ: Australia/Sydney
      PUID: '1000'
      PGID: '1000'
      UMASK: '022'
      SUBARR_PORT: '9922'
      SUBARR_MEDIA_ROOT: /media/library
      SUBGEN_COMPOSE_PATH: /dockercontainers/subgen/compose.yaml
      SUBGEN_URL: http://subgen:9000
      SUBGEN_CONTAINER: subgen
      SUBARR_DB_PATH: /data/subarr.db
    volumes:
    - /mnt/nas/Media:/media/library:ro
    - /var/run/docker.sock:/var/run/docker.sock
    - /mnt/c/DockerContainers/subgen:/dockercontainers/subgen:ro
    - /mnt/c/DockerContainers/subarr/data:/data
    labels:
    - maintenance_log=[2026-05-27] Rev2 rename subgenscan-gui to subarr; mode-switching dropped (per-language kwargs handle this); mount /dockercontainers/subgen as read-only
    env_file:
    - .env
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  safe-bridge:
    external: true

# [2026-05-27] Rev2: rename to subarr, drop mode-switching, /dockercontainers/subgen mount now read-only.
