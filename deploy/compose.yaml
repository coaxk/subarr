services:
  subarr:
    image: ghcr.io/coaxk/subarr:latest
    container_name: subarr
    restart: unless-stopped
    networks:
    - safe-bridge
    ports:
    - 9922:9922
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    # ── Optional GPU — Monitor-tab sparkline only (#162) ───────────────
    # subarr never transcodes (subgen does that). The ONLY GPU use is
    # running nvidia-smi for the Monitor tab's GPU sparkline, so it's
    # entirely optional — leave it off if you have no NVIDIA GPU and subarr
    # runs fine (the sparkline just shows N/A). To enable, uncomment the
    # line below + the two NVIDIA_* env vars. This is the portable form
    # (plain Docker + Unraid); no Swarm-style deploy.devices reservation.
    # runtime: nvidia
    environment:
      TZ: Australia/Sydney
      PUID: '1000'
      PGID: '1000'
      UMASK: '022'
      # GPU sparkline (uncomment together with `runtime: nvidia` above):
      # NVIDIA_VISIBLE_DEVICES: all
      # NVIDIA_DRIVER_CAPABILITIES: utility   # nvidia-smi only — not compute/video
      SUBARR_PORT: '9922'
      SUBARR_MEDIA_ROOT: /media/library
      SUBGEN_COMPOSE_PATH: /dockercontainers/subgen/compose.yaml
      SUBGEN_URL: http://subgen:9000
      SUBGEN_CONTAINER: subgen
      SUBARR_DB_PATH: /data/subarr.db
    volumes:
    - /mnt/nas/Media:/media/library:ro
    - /var/run/docker.sock:/var/run/docker.sock
    - /mnt/c/DockerContainers/subgen:/dockercontainers/subgen:ro
    - /mnt/c/DockerContainers/subarr/data:/data
    labels:
    - maintenance_log=[2026-06-01] Queue issues panel disambiguates subgen-skipped rows (sub_exists vs unknown) — sub_exists rows route to Recently done, render in neutral grey
    - maintenance_log=[2026-05-27] GPU passthrough (utility capability only) for /api/gpu nvidia-smi access
    env_file:
    - .env
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  safe-bridge:
    external: true

# [2026-05-27] GPU passthrough added (utility capability only) so /api/gpu can run nvidia-smi for the Monitor tab.
# [2026-06-01] Queue Issues panel: disambiguate subgen-skipped rows. queue.py now infers sub_exists vs unknown from filesystem; UI routes sub_exists into Recently done with a neutral chip instead of warn-amber under Issues.
